model = "gpt-6.2-sol"
model_reasoning_effort = "medium"
model_reasoning_summary = "detailed"
model_verbosity = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"
approvals_reviewer = "user"
personality = "pragmatic"
web_search = "live"

[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[projects."/home/junghan"]
trust_level = "trusted"

[projects."/home/junghan/sync/org"]
trust_level = "trusted"

[projects."/home/junghan/repos/gh/agent-config"]
trust_level = "trusted"

[projects."/home/junghan/repos/gh/entwurf"]
trust_level = "trusted"

[projects."/home/junghan/repos/gh/nixos-config"]
trust_level = "trusted"

[projects."/home/junghan/repos/gh/memex-kb"]
trust_level = "trusted"

[projects."/home/junghan/repos/work/voscli"]
trust_level = "trusted"

[projects."/home/junghan/.openclaw"]
trust_level = "trusted"

[tui]
terminal_title = ["activity", "project-name", "thread-id"]
status_line = ["thread-title", "model-with-reasoning", "current-dir", "git-branch", "context-used", "weekly-limit", "context-window-size"]
theme = "dracula"
screen_reader_detection_done = true
notification_condition = "unfocused"

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 2

[plugins."google-calendar@openai-curated"]
enabled = false

[plugins."netlify@openai-curated"]
enabled = false

[plugins."github@openai-curated"]
enabled = false
