disabledProviders:
  - openrouter
  - huggingface
  - google
  - amazon-bedrock
  - bedrock-mantle
  - groq
symbolPreset: nerd
composer:
  shape: pi
theme:
  dark: dark-catppuccin
setupVersion: 2
statusLine:
  preset: default
  separator: slash
  contextLine: embedded
  transparent: true
  compactThinkingLevel: false
  showHookStatus: true
modelRoles:
  default: anthropic/claude-opus-5
tools:
  xdev: false
terminal:
  showProgress: false
tui:
  textSizing: false
display:
  cacheMissMarker: true
  showTokenUsage: true
  shimmer: classic
  showTurnTime: true
dev:
  autoqaConsent: denied
task:
  showResolvedModelBadge: false
  # OMP's role agents spend calls without an explicit sibling-to-sibling request.
  disabledAgents:
    - reviewer
    - scout
    - security-reviewer
    - sonic
    - task
browser:
  headless: true
